<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>The Defriends - Capitulo 01</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap');
body {
  background: #8B4513;
  background-image: 
    radial-gradient(circle at 20% 50%, rgba(245,222,179,0.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(226,114,91,0.1) 0%, transparent 50%);
  color:#FFF8E7;
  margin:0;
  font-family:'Cinzel', serif;
  text-align:center;
}
.topo {
  position:sticky; top:0;
  background: linear-gradient(90deg, #B22222, #8B4513);
  padding:15px 0; border-bottom:3px solid #F5DEB3; z-index:10;
  box-shadow: 0 2px 15px rgba(0,0,0,0.5);
}
.topo a {
  color:#F5DEB3; text-decoration:none; padding:8px 18px;
  border:2px solid #F5DEB3; border-radius:6px; font-weight:700;
}
.topo a:hover { background:#F5DEB3; color:#8B4513; }
.topo h2 { margin:10px 0 0; font-size:20px; color:#F5DEB3; }

.container { max-width:800px; margin:0 auto; padding:20px; }
.pagina {
  margin-bottom:15px;
  box-shadow:0 5px 25px rgba(0,0,0,0.6);
  border:3px solid #E2725B;
  border-radius:8px;
  background:#000;
}
.pagina img {
  width:100%;
  display:block;
  border-radius:5px;
}
.num-pag {
  color:#F5DEB3; font-size:14px; padding:8px; background:rgba(178,34,34,0.5);
}
</style>
</head>
<body>

<div class="topo">
  <a href="../../index.html">⬅ VOLTAR AO MENU</a>
  <h2>THE DEFRIENDS - FASE 01</h2>
</div>

<div class="container" id="container"></div>

<script>
let total = 26; // muda aqui
let container = document.getElementById('container');

for(let i = 1; i <= total; i++){
  let div = document.createElement('div');
  div.className = 'pagina';
  
  let num = document.createElement('div');
  num.className = 'num-pag';
  num.innerText = `PÁGINA ${i}`;
  
  let img = document.createElement('img');
  img.src = `01/${String(i).padStart(3,'0')}.jpg`;
  img.loading = "lazy"; // carrega conforme rola
  
  div.appendChild(num);
  div.appendChild(img);
  container.appendChild(div);
}
</script>
</body>
</html>
