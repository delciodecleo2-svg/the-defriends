<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Leitor - Fase 01</title>
<style>
body { background:#000; text-align:center; margin:0; }
img { max-width:100%; height:auto; }
.botoes { position:fixed; bottom:10px; width:100%; }
.botoes a { background:#00ff88; color:#000; padding:10px 20px; margin:5px; border-radius:5px; text-decoration:none; font-weight:bold; }
</style>
</head>
<body>
<img id="pagina" src="01/001.jpg">
<div class="botoes">
  <a href="#" onclick="ant()">ANTERIOR</a>
  <a href="#" onclick="prox()">PRÓXIMA</a>
</div>
<script>
let atual = 1;
let total = 26; // 26
function prox(){
  if(atual < total) { atual++; document.getElementById('pagina').src = `01/${String(atual).padStart(3,'0')}.jpg`; }
}
function ant(){
  if(atual > 1) { atual--; document.getElementById('pagina').src = `01/${String(atual).padStart(3,'0')}.jpg`; }
}
</script>
</body>
</html>
