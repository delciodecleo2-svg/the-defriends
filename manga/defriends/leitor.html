<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>The Defriends - capitulo 01 </title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap');

body {
  background: linear-gradient(135deg, #004D40 0%, #00695C 50%, #004D40 100%);
  color:#F5F5F5;
  margin:0;
  font-family:'Cinzel', serif;
  padding-bottom:40px;
}
.topo {
  position:sticky; top:0;
  background: linear-gradient(90deg, #004D40, #00796B);
  padding:15px 0; border-bottom:3px solid #FFD700; z-index:10;
  display:flex; justify-content:center; align-items:center;
  box-shadow: 0 2px 15px rgba(255,215,0,0.3);
}
.topo a {
  position:absolute; left:20px;
  color:#FFD700; text-decoration:none; padding:8px 18px;
  border:2px solid #FFD700; border-radius:6px; font-weight:700; transition:0.3s;
}
.topo a:hover { background:#FFD700; color:#004D40; }
.topo h2 { margin:0; font-size:22px; color:#FFD700; }

.container { max-width:900px; margin:30px auto; padding:0 20px; }
.titulo-lista { text-align:center; font-size:24px; margin-bottom:25px; color:#FFD700; }

.lista-paginas {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap:20px;
}

.item-pagina {
  background: linear-gradient(180deg, #00695C, #004D40);
  border:2px solid #FFD700;
  border-radius:12px;
  padding:8px;
  text-align:center;
  transition:0.3s;
  cursor:pointer;
  box-shadow:0 0 15px rgba(255,215,0,0.2);
}
.item-pagina:hover { 
  transform:translateY(-5px); 
  box-shadow:0 0 25px rgba(255,215,0,0.6);
  border-color:#FFF8DC;
}
.item-pagina img {
  width:100%;
  border-radius:8px;
  border:1px solid #FFD700;
  aspect-ratio: 3/4;
  object-fit:cover;
}
.item-pagina span {
  display:block;
  margin-top:8px;
  color:#FFD700;
  font-weight:700;
  font-size:15px;
}

/* Modal para ler em tela cheia */
.modal {
  display:none; position:fixed; z-index:100; left:0; top:0; width:100%; height:100%;
  background:rgba(0,0,0,0.95); justify-content:center; align-items:center;
}
.modal img { max-width:95%; max-height:95%; border:3px solid #FFD700; border-radius:8px; }
.fechar {
  position:absolute; top:20px; right:35px; color:#FFD700; font-size:40px; font-weight:bold;
  cursor:pointer; border:2px solid #FFD700; border-radius:50%; width:45px; height:45px; line-height:40px;
}
.nav-btn {
  position:absolute; top:50%; transform:translateY(-50%);
  color:#FFD700; font-size:50px; font-weight:bold; padding:10px 20px;
  cursor:pointer; user-select:none;
}
.prev { left:20px; }
.next { right:20px; }
</style>
</head>
<body>

<div class="topo">
  <a href="../../index.html">⬅ MENU</a>
  <h2>THE DEFRIENDS - FASE 01</h2>
</div>

<div class="container">
  <h3 class="titulo-lista">ESCOLHA UMA PÁGINA</h3>
  <div class="lista-paginas" id="lista"></div>
</div>

<!-- Modal para leitura -->
<div id="modal" class="modal">
  <span class="fechar" onclick="fecharModal()">&times;</span>
  <span class="nav-btn prev" onclick="trocar(-1)">&#10094;</span>
  <img id="imgModal" src="">
  <span class="nav-btn next" onclick="trocar(1)">&#10095;</span>
</div>

<script>
let total = 26; // muda aqui se tiver mais paginas
let paginaAtual = 1;
let lista = document.getElementById('lista');

// Gera a lista de miniaturas
for(let i = 1; i <= total; i++){
  let div = document.createElement('div');
  div.className = 'item-pagina';
  div.onclick = () => abrirModal(i);
  
  let img = document.createElement('img');
  img.src = `01/${String(i).padStart(3,'0')}.jpg`;
  img.loading = "lazy"; // carrega só quando aparece na tela
  
  let span = document.createElement('span');
  span.innerText = `PÁGINA ${i}`;
  
  div.appendChild(img);
  div.appendChild(span);
  lista.appendChild(div);
}

function abrirModal(pag){
  paginaAtual = pag;
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('imgModal').src = `01/${String(pag).padStart(3,'0')}.jpg`;
}

function fecharModal(){
  document.getElementById('modal').style.display = 'none';
}

function trocar(dir){
  paginaAtual += dir;
  if(paginaAtual < 1) paginaAtual = total;
  if(paginaAtual > total) paginaAtual = 1;
  document.getElementById('imgModal').src = `01/${String(paginaAtual).padStart(3,'0')}.jpg`;
}

// Teclas
document.addEventListener('keydown', e => {
  if(document.getElementById('modal').style.display === 'flex'){
    if(e.key === 'ArrowRight') trocar(1);
    if(e.key === 'ArrowLeft') trocar(-1);
    if(e.key === 'Escape') fecharModal();
  }
});
</script>
</body>
</html>
