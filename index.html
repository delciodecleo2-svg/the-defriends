<!DOCTYPE html>
<html>
<head>
    <title>Reencontro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- TELA DO MENU -->
    <div id="menu-screen">
        <img id="manga-cover" src="" width="300">
        <h1 id="manga-title"></h1>
        <p id="manga-desc"></p>
        <div id="phases-list"></div>
    </div>

    <!-- TELA DO LEITOR -->
    <div id="reader-screen" style="display:none;">
        <button onclick="backToMenu()">Voltar</button>
        <p id="page-counter"></p>
        <img id="page-image" src="" style="width:100%; max-width:800px;">
        <p id="page-text"></p>
        <button id="prev-btn" onclick="prevPage()">Anterior</button>
        <button id="next-btn" onclick="nextPage()">Próxima</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
