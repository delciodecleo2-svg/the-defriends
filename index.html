<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>The Defriends - Menu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap');
body {
  background: linear-gradient(180deg, #B22222 0%, #8B4513 100%);
  color:#FFF8E7; font-family:'Cinzel', serif; text-align:center; margin:0;
}
header { padding:30px 20px; background: linear-gradient(180deg, #B22222, #8B4513); border-bottom:4px solid #F5DEB3; }
h1 {
  margin:0; font-size:40px;
  background: linear-gradient(90deg, #F5DEB3, #FFF8E7, #F5DEB3);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 0 15px rgba(245,222,179,0.5);
}

.grid { display:flex; flex-wrap:wrap; justify-content:center; gap:30px; padding:40px 20px; }
.card {
  background: linear-gradient(180deg, #A0522D, #8B4513);
  border-radius:15px; padding:15px; width:260px;
  border:3px solid #F5DEB3; box-shadow:0 0 20px rgba(245,222,179,0.3);
  transition:0.3s;
}
.card:hover { transform:translateY(-8px); box-shadow:0 0 30px rgba(245,222,179,0.6); }
.card img { width:100%; border-radius:10px; border:2px solid #E2725B; }
.card h3 { color:#F5DEB3; margin:10px 0 5px; }
.classificacao { 
  background:#B22222; color:#FFF8E7; padding:3px 10px; border-radius:20px; 
  font-size:12px; font-weight:700; display:inline-block; margin-bottom:8px;
}
.card a {
  color:#8B4513; background:#F5DEB3; text-decoration:none; font-weight:700; font-size:16px;
  display:block; margin-top:10px; padding:10px; border-radius:8px;
}
.card a:hover { background:#FFF8E7; }

/* ZONA REDES SOCIAIS */
footer {
  background: linear-gradient(0deg, #B22222, #8B4513);
  border-top:4px solid #F5DEB3; padding:30px 20px; margin-top:40px;
}
footer h3 { color:#F5DEB3; margin-bottom:15px; }
.socials { display:flex; justify-content:center; gap:20px; }
.socials a {
  color:#FFF8E7; text-decoration:none; padding:10px 20px;
  border:2px solid #F5DEB3; border-radius:8px; font-weight:700; transition:0.3s;
}
.socials a:hover { background:#F5DEB3; color:#8B4513; }
</style>
</head>
<body>

<header>
  <h1>THE DEFRIENDS</h1>
</header>

<div class="grid">
  <div class="card">
    <img src="manga/defriends/cover.jpg" alt="Capa">
    <h3>Capitulo 01</h3>
    <span class="classificacao">+14 Ação / Drama</span>
    <p><a href="manga/defriends/leitor.html">LER AGORA</a></p>
  </div>

  <!-- COPIA ESSE CARD PRA ADICIONAR MAIS FASES DEPOIS -->
</div>

<footer>
  <h3>SIGA-NOS</h3>
  <div class="socials">
    <a href="https://www.facebook.com/profile.php?id=100076269801868" target="_blank">FACEBOOK</a>
    <a href="https://www.instagram.com/defriends_homecoming?stkn=NHM3bmRsZHZ2bDRz target="_blank">INSTAGRAM</a>
    <a href="https://twitter.com/" target="_blank">TWITTER</a>
  </div>
</footer>

</body>
</html>
